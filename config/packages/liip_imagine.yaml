liip_imagine:
    resolvers:
        default:
            web_path:
                web_root: "%kernel.project_dir%/public"
                cache_prefix: "media/cache"
    
    filter_sets:
        noho_hero:
            quality: 85
            filters:
                thumbnail:
                    size: [1920, 1080]
                    mode: outbound
                    allow_upscale: true
