# Noho Conciergerie - Fixtures for luxury property rentals

sylius_fixtures:
    suites:
        noho:
            listeners:
                orm_purger: ~
                logger: ~

            fixtures:
                # ==========================================
                # LOCALES & CURRENCIES
                # ==========================================
                locale:
                    options:
                        locales:
                            - 'en_US'
                            - 'fr_FR'

                currency:
                    options:
                        currencies:
                            - 'EUR'
                            - 'USD'

                # ==========================================
                # GEOGRAPHICAL
                # ==========================================
                geographical:
                    options:
                        countries:
                            - 'FR'
                            - 'ES'
                            - 'PT'
                            - 'GR'
                            - 'IT'
                        zones:
                            EU:
                                name: 'European Union'
                                countries:
                                    - 'FR'
                                    - 'ES'
                                    - 'PT'
                                    - 'GR'
                                    - 'IT'

                # ==========================================
                # TAXONS (Categories)
                # ==========================================
                noho_taxon:
                    name: taxon
                    options:
                        custom:
                            catalogue:
                                code: 'catalogue'
                                name: 'Catalogue'
                                children:
                                    # FRANCE
                                    -   code: 'france'
                                        name: 'France'
                                        slug: 'catalogue/france'
                                        children:
                                            -   code: 'paris'
                                                name: 'Paris'
                                                slug: 'catalogue/france/paris'
                                            -   code: 'nice'
                                                name: 'Nice'
                                                slug: 'catalogue/france/nice'
                                            -   code: 'saint_tropez'
                                                name: 'Saint-Tropez'
                                                slug: 'catalogue/france/saint-tropez'
                                            -   code: 'cannes'
                                                name: 'Cannes'
                                                slug: 'catalogue/france/cannes'

                                    # SPAIN
                                    -   code: 'spain'
                                        name: 'Espagne'
                                        slug: 'catalogue/espagne'
                                        children:
                                            -   code: 'ibiza'
                                                name: 'Ibiza'
                                                slug: 'catalogue/espagne/ibiza'
                                            -   code: 'marbella'
                                                name: 'Marbella'
                                                slug: 'catalogue/espagne/marbella'
                                            -   code: 'mallorca'
                                                name: 'Majorque'
                                                slug: 'catalogue/espagne/majorque'

                                    # PORTUGAL
                                    -   code: 'portugal'
                                        name: 'Portugal'
                                        slug: 'catalogue/portugal'
                                        children:
                                            -   code: 'lisbon'
                                                name: 'Lisbonne'
                                                slug: 'catalogue/portugal/lisbonne'
                                            -   code: 'algarve'
                                                name: 'Algarve'
                                                slug: 'catalogue/portugal/algarve'

                                    # GREECE
                                    -   code: 'greece'
                                        name: 'Grèce'
                                        slug: 'catalogue/grece'
                                        children:
                                            -   code: 'mykonos'
                                                name: 'Mykonos'
                                                slug: 'catalogue/grece/mykonos'
                                            -   code: 'santorini'
                                                name: 'Santorin'
                                                slug: 'catalogue/grece/santorin'

                                    # ITALY
                                    -   code: 'italy'
                                        name: 'Italie'
                                        slug: 'catalogue/italie'
                                        children:
                                            -   code: 'amalfi'
                                                name: 'Côte Amalfitaine'
                                                slug: 'catalogue/italie/amalfi'
                                            -   code: 'tuscany'
                                                name: 'Toscane'
                                                slug: 'catalogue/italie/toscane'

                # ==========================================
                # CHANNEL
                # ==========================================
                channel:
                    options:
                        custom:
                            noho_web:
                                name: 'Noho Conciergerie'
                                code: 'NOHO_WEB'
                                locales:
                                    - 'en_US'
                                    - 'fr_FR'
                                currencies:
                                    - 'EUR'
                                enabled: true
                                hostname: 'localhost'
                                shop_billing_data:
                                    company: 'Noho Conciergerie'
                                    tax_id: 'FR12345678901'
                                    country_code: 'FR'
                                    street: '1 Avenue des Champs-Élysées'
                                    city: 'Paris'
                                    postcode: '75008'
                                menu_taxon: 'catalogue'
                                contact_phone_number: '+33 1 23 45 67 89'
                                contact_email: 'contact@noho-conciergerie.com'

                # ==========================================
                # PAYMENT (required for checkout with total > 0)
                # ==========================================
                payment_method:
                    options:
                        custom:
                            bank_transfer:
                                code: 'bank_transfer'
                                name: 'Virement bancaire'
                                description: 'Paiement par virement'
                                gatewayName: 'Offline'
                                gatewayFactory: 'offline'
                                channels:
                                    - 'NOHO_WEB'
                                enabled: true

                # ==========================================
                # TAX CATEGORIES
                # ==========================================
                tax_category:
                    options:
                        custom:
                            rental:
                                code: 'rental'
                                name: 'Location saisonnière'

                tax_rate:
                    options:
                        custom:
                            rental_tax:
                                code: 'rental_tax_10'
                                name: 'TVA Location 10%'
                                zone: 'EU'
                                category: 'rental'
                                amount: 0.10

                # ==========================================
                # PRODUCT ATTRIBUTES
                # ==========================================
                noho_attribute:
                    name: product_attribute
                    options:
                        custom:
                            -   name: 'Voyageurs'
                                code: 'voyageurs'
                                type: 'integer'
                                translatable: false
                            -   name: 'Chambres'
                                code: 'chambres'
                                type: 'integer'
                                translatable: false
                            -   name: 'Surface (m²)'
                                code: 'surface'
                                type: 'integer'
                                translatable: false

                # ==========================================
                # ADMIN USER
                # ==========================================
                admin_user:
                    name: 'admin_user'
                    options:
                        custom:
                            -   email: 'admin@noho-conciergerie.com'
                                username: 'admin'
                                password: 'noho2024'
                                enabled: true
                                locale_code: 'fr_FR'
                                first_name: 'Admin'
                                last_name: 'Noho'

                # ==========================================
                # SHOP USER (Front office — connexion boutique)
                # ==========================================
                shop_user:
                    name: 'shop_user'
                    options:
                        random: 0
                        custom:
                            -   email: 'customer@noho-conciergerie.com'
                                first_name: 'Client'
                                last_name: 'Démo'
                                password: 'noho2024'
                                enabled: true

                # ==========================================
                # PRODUCTS (Properties)
                # ==========================================
                noho_products:
                    name: product
                    options:
                        custom:
                            # ========== PARIS ==========
                            -   code: 'villa-montmartre'
                                name: 'Villa Montmartre'
                                short_description: 'Villa d''exception avec vue panoramique sur Paris'
                                description: 'Nichée au cœur de Montmartre, cette villa d''exception offre une vue imprenable sur Paris. Avec ses 3 chambres, son vaste séjour et son jardin privatif, elle est l''endroit idéal pour un séjour inoubliable dans la capitale.'
                                tax_category: 'rental'
                                shipping_required: false
                                channels:
                                    - 'NOHO_WEB'
                                main_taxon: 'paris'
                                taxons:
                                    - 'catalogue'
                                    - 'france'
                                    - 'paris'
                                product_attributes:
                                    voyageurs: 6
                                    chambres: 3
                                    surface: 180
                                images:
                                    -   path: '%kernel.project_dir%/src/Resources/fixtures/properties/villa1.jpg'
                                        type: 'main'
                                    -   path: '%kernel.project_dir%/src/Resources/fixtures/properties/villa2.jpg'

                            -   code: 'appartement-marais'
                                name: 'Appartement Le Marais'
                                short_description: 'Appartement de charme au cœur du Marais'
                                description: 'Cet élégant appartement situé dans le quartier historique du Marais allie charme parisien et confort moderne. Hauts plafonds, parquet et mobilier design.'
                                tax_category: 'rental'
                                shipping_required: false
                                channels:
                                    - 'NOHO_WEB'
                                main_taxon: 'paris'
                                taxons:
                                    - 'catalogue'
                                    - 'france'
                                    - 'paris'
                                product_attributes:
                                    voyageurs: 4
                                    chambres: 2
                                    surface: 95
                                images:
                                    -   path: '%kernel.project_dir%/src/Resources/fixtures/properties/villa3.jpg'
                                        type: 'main'

                            # ========== NICE ==========
                            -   code: 'villa-promenade'
                                name: 'Villa Promenade des Anglais'
                                short_description: 'Villa prestigieuse sur la Promenade des Anglais'
                                description: 'Cette villa Art Déco offre un accès direct à la plage et une vue panoramique sur la mer. Piscine à débordement, jardin paysager et parking privé.'
                                tax_category: 'rental'
