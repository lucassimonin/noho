# Overrides Sylius default TemplateController homepage (must load after sylius_shop.yaml — "z_" prefix).
sylius_shop_homepage:
    path: /{_locale}/
    controller: App\Controller\Shop\HomepageController
    methods: [GET]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
