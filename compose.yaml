
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    # Le nom de l'image locale
    image: noho
    # Important pour le hot-reloading en dev
    volumes:
      - ./:/app
      - /app/var
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS (Caddy gère le certif auto-signé)
      - "443:443/udp" # HTTP/3
    environment:
      # Active le mode debug symfony
      APP_ENV: dev
      APP_SECRET: changer_ce_secret_en_prod
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_IDE_CONFIG: "serverName=noho_docker"
      # Activation du worker mode (optionnel, commente pour mode classique)
      # FRANKENPHP_CONFIG: "worker ./public/index.php"
    tty: true
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "5433:5432"
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
